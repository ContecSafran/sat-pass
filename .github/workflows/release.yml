name: 배포 (APK 릴리스)

# GitHub 의 Actions 탭 > "배포 (APK 릴리스)" > Run workflow 버튼으로 실행한다.
# 실행이 끝나면 Releases 에 APK 가 붙은 릴리스가 만들어지고,
# 휴대폰 브라우저로 그 APK 링크를 열면 바로 설치할 수 있다.
on:
  workflow_dispatch:
    inputs:
      release_note:
        description: '릴리스 메모 (이번 빌드에서 바뀐 점)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: APK 빌드 및 릴리스
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK 설정
        uses: android-actions/setup-android@v4

      - name: SDK 구성요소 설치
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 단위 테스트
        run: ./gradlew testDebugUnitTest

      - name: APK 빌드
        run: ./gradlew assembleDebug

      # 태그로 실행하면 태그 이름을, 수동 실행이면 build-<실행번호> 를 쓴다.
      - name: 릴리스 정보 결정
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="build-${{ github.run_number }}"
          fi
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK_NAME="sat-pass-${VERSION_NAME}-${TAG}.apk"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "sha256=$(sha256sum "${APK_NAME}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 릴리스 생성 및 APK 첨부
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="${{ inputs.release_note }}"
          {
            echo "## sat-pass ${{ steps.meta.outputs.version_name }} (${{ steps.meta.outputs.tag }})"
            echo
            if [ -n "$NOTE" ]; then
              echo "$NOTE"
              echo
            fi
            echo "### 설치 방법"
            echo
            echo "1. **휴대폰에서** 아래 \`${{ steps.meta.outputs.apk_name }}\` 를 눌러 받습니다."
            echo "2. 처음이라면 브라우저에 \"출처를 알 수 없는 앱 설치\" 권한을 허용해 주세요."
            echo "3. 받은 파일을 열면 설치됩니다."
            echo
            echo "> 비공개 저장소라서 휴대폰 브라우저에서도 GitHub 에 로그인되어 있어야 받을 수 있습니다."
            echo
            echo "### 빌드 정보"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 커밋 | \`${{ github.sha }}\` |"
            echo "| 서명 | 디버그 키 (개발·검증용) |"
            echo "| SHA-256 | \`${{ steps.meta.outputs.sha256 }}\` |"
          } > release-notes.md

          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.apk_name }}" \
            --title "sat-pass ${{ steps.meta.outputs.tag }}" \
            --notes-file release-notes.md

      - name: 요약에 설치 링크 표시
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }}"
          {
            echo "## 배포 완료"
            echo
            echo "휴대폰에서 아래 링크를 열어 APK 를 받으세요."
            echo
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
